# Credential types this external issuer offers (walt.id issuer-api 1.0 format). walt.id adds an SD-JWT variant
# of every type listed as an array, e.g. "UniversityDegree_vc+sd-jwt" with vct <baseUrl>/draft13/UniversityDegree.
# To add a type for the playground: add it here, add it to infra/parties.yaml, then restart both.
supportedCredentialTypes = {
    UniversityDegree = [VerifiableCredential, UniversityDegree],
    "LibraryCard_vc+sd-jwt" = {
        format = "vc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        vct = "http://waltid-issuer:7002/LibraryCard"
        display = [ { name = "City Library Card", locale = "en-US", background_color = "#7A2E1D", text_color = "#FFF8EE" } ]
    }
}
