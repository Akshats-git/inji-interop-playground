# Inji Interoperability Playground: overrides for Certify A (issuer-initiated, pre-authorized code flow).
# Spring profile "playground" is activated after "default", so these keys win. Core service code is untouched.

# --- Public identity -------------------------------------------------------------------------------
# Wallets only ever see Certify through the playground gateway (/pub/certify/*), which records every
# message for the protocol inspector. PUBLIC_BASE_URL is the gateway origin (localhost or a tunnel).
mosip.certify.domain.url=${PUBLIC_BASE_URL:http://playground.localhost:8080}/pub/certify
# Certify publishes credential_issuer = domain url (see CredentialConfigurationServiceImpl), so the offer's
# credential_issuer, the authorization server, the token "iss" and the proof JWT "aud" all use that same
# string. The gateway maps <domain>/.well-known/* to Certify's /v1/certify/.well-known/*, as upstream's
# certify-nginx does.
mosip.certify.identifier=${mosip.certify.domain.url}
mosip.certify.discovery.issuer-id=${mosip.certify.domain.url}
mosip.certify.credential-offer-url=${mosip.certify.domain.url}${server.servlet.path}/credential-offer-data/

# --- Pre-authorized code flow (Certify acts as its own authorization server) ---------------------------
mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.plugin-mode=DataProvider
mosip.certify.authorization.url=${mosip.certify.domain.url}
mosip.certify.oauth.issuer=${mosip.certify.domain.url}
mosip.certify.oauth.token-endpoint=${mosip.certify.domain.url}${server.servlet.path}/oauth/token
mosip.certify.oauth.jwks-uri=${mosip.certify.domain.url}${server.servlet.path}/.well-known/jwks.json
mosip.certify.oauth.access-token.audience=${mosip.certify.domain.url}${server.servlet.path}/issuance/credential
mosip.certify.oauth.grant-types-supported=urn:ietf:params:oauth:grant-type:pre-authorized_code
mosip.certify.authorization.default-server=${mosip.certify.oauth.issuer}
# Access tokens are signed by Certify itself, so validate them against its own JWKS (internal address).
mosip.certify.authn.issuer-uri=${mosip.certify.oauth.issuer}
mosip.certify.authn.jwk-set-uri=http://localhost:8090/v1/certify/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.oauth.access-token.audience}', '${mosip.certify.identifier}' }
mosip.certify.pre-auth-code.max-expiry-seconds=86400
mosip.certify.pre-auth.max-expiry-seconds=86400
mosip.certify.cnonce-expire-seconds=300

# --- Issuer identity used for Certify's own /.well-known/did.json -----------------------------------
mosip.certify.data-provider-plugin.did-url=${CERTIFY_DEFAULT_DID:did:web:playground.localhost%3A8080:pub:certify}
mosip.certify.data-provider-plugin.id-field-prefix-uri=urn:uuid:
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020
mosip.certify.data-provider-plugin.vc-expiry-duration=P730D
mosip.certify.credential-config.issuer.display={{'name': 'Inji Interop Playground', 'locale': 'en'}}

# --- Signing algorithms ----------------------------------------------------------------------------------
# Upstream maps the W3C ecdsa-rdfc-2019 / ecdsa-jcs-2019 suites to ES256K; the specs define them for P-256/P-384.
# Kept as upstream on purpose: the playground surfaces this as a capability gap rather than hiding it.
mosip.certify.supported.jwt-proof-alg={'RS256','PS256','ES256','EdDSA','Ed25519'}
mosip.certify.credential-config.proof-types-supported={'jwt': {'proof_signing_alg_values_supported': {'RS256', 'PS256', 'ES256', 'EdDSA'}}}

# Quieter logs, smaller footprint.
management.endpoints.web.exposure.include=health,info
logging.level.root=WARN
logging.level.io.mosip.certify=INFO

# --- Database (the bundle's shared Postgres) ---------------------------------------------------------
mosip.certify.database.hostname=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# --- Caches --------------------------------------------------------------------------------------------
# The injistack default list lacks credentialOfferCache, which /pre-authorized-data needs
# ("credentialOfferCache not available"). Names and sizes follow upstream's application-local.properties.
mosip.certify.cache.names=userinfo,vcissuance,templatecache,certificatedatacache,credentialConfig,renderTemplate,jwks,preAuthCodeCache,credentialOfferCache,issuerMetadataCache,asMetadataCache
mosip.certify.pre-auth.cache-expire-seconds=86400
mosip.certify.credential-offer.cache-expire-seconds=86400
mosip.certify.cache.size={'userinfo': 200, 'vcissuance' : 2000, 'templatecache': 20, 'jwks': 1, 'preAuthCodeCache': 1000, 'credentialOfferCache': 1000, 'issuerMetadataCache': 10}
mosip.certify.cache.expire-in-seconds={'userinfo': ${mosip.certify.access-token-expire-seconds}, 'vcissuance': ${mosip.certify.access-token-expire-seconds}, 'templatecache': 43200, 'certificatedatacache': ${mosip.certify.certificatedatacache-expire-seconds}, 'credentialConfig': 60, 'renderTemplate': ${mosip.certify.common.cache-expire-seconds}, 'jwks': ${mosip.certify.jwks-cache-expire-seconds}, 'preAuthCodeCache': ${mosip.certify.pre-auth.cache-expire-seconds}, 'credentialOfferCache': ${mosip.certify.credential-offer.cache-expire-seconds}, 'issuerMetadataCache': 60, 'asMetadataCache': 60}
